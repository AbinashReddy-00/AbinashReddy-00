<!DOCTYPE html>\n<html lang="en">\n<head>\n    <meta charset="UTF-8">\n    <meta name="viewport" content="width=device-width, initial-scale=1.0">\n    <title>Premium Intro</title>\n    <style>\n        body {\n            display: flex;\n            justify-content: center;\n            align-items: center;\n            height: 100vh;\n            background-color: #282c34;\n            color: transparent;\n            font-size: 2em;\n            font-family: 'Courier New', Courier, monospace;\n        }\n        .gradient-text {\n            background: linear-gradient(90deg, #ff0080, #ff8c00);\n            background-clip: text;\n            -webkit-background-clip: text;\n            animation: typewriter 4s steps(30) infinite;\n        }\n        @keyframes typewriter {\n            0% { width: 0; }\n            50% { color: #ffffff; }\n            100% { width: 100%; }\n        }\n        .cursor {\n            display: inline-block;\n            animation: blink 0.7s step-end infinite;\n            color: #fff;\n        }\n        @keyframes blink {\n            0%, 100% { opacity: 1; }\n            50% { opacity: 0; }\n        }\n    </style>\n</head>\n<body>\n    <div class="gradient-text">Welcome to the Premium Intro</div><div class="cursor">|</div>\n    <script>\n        // Typewriter effect\n        let text = 'Get Ready for an Amazing Experience!';\n        let index = 0;\n        let speed = 100;\n        function typeWriter() {\n            if (index < text.length) {\n                document.querySelector('.gradient-text').innerHTML += text.charAt(index);\n                index++;\n                setTimeout(typeWriter, speed);\n            }\n        }\n        setTimeout(typeWriter, 2000);\n    </script>\n</body>\n</html>\n
